<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Manager Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Contact Manager</h1>
      <p>Keep your connections organized</p>
    </header>

    <main class="main-content">
      <section class="form-section">
        <form id="contact-form">
          <h2 id="form-title">Add New Contact</h2>
          <input type="hidden" id="edit-id">
          
          <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="e.g. John Doe">
          </div>

          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="e.g. john@example.com">
          </div>

          <div class="input-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required placeholder="e.g. +1 234 567 890">
          </div>

          <div class="input-group">
            <label for="image">Image URL</label>
            <input type="url" id="image" placeholder="https://example.com/avatar.jpg">
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">Add Contact</button>
            <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
          </div>
        </form>
      </section>

      <section class="list-section">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search contacts by name or email...">
        </div>

        <div id="contacts-list" class="contacts-grid"></div>
        <div id="no-contacts" class="empty-state hidden">No contacts found.</div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
